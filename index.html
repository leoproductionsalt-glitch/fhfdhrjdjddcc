```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            max-width: 600px;
        }

        h1 {
            font-size: 24px;
        }

        input {
            padding: 12px;
            font-size: 18px;
            border: 2px solid #ccc;
            border-radius: 8px;
            margin-top: 15px;
        }

        button {
            padding: 12px 20px;
            font-size: 18px;
            margin-left: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        #link {
            display: none;
            margin-top: 15px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Che l’è el mè segond culur preferì, rispòsta en Luo?</h1>

        <input type="text" id="answer" placeholder="Type your answer">
        <button onclick="checkAnswer()">Submit</button>

        <div id="result"></div>

        <div id="link">
            <a href="https://docs.google.com/videos/d/1kBIJ1Rg-ccSZDA0pF711qDTMQcXHYtVKVXsM6mIU0lg/play?usp=sharing"
               target="_blank">
                Correct! Click here
            </a>
        </div>
    </div>

    <script>
        function checkAnswer() {
            const answer = document.getElementById("answer").value.trim();

            if (answer.toLowerCase() === "rateng") {
                document.getElementById("result").textContent = "Correct!";
                document.getElementById("result").style.color = "green";
                document.getElementById("link").style.display = "block";
            } else {
                document.getElementById("result").textContent = "Wrong!";
                document.getElementById("result").style.color = "red";
                document.getElementById("link").style.display = "none";
            }
        }
    </script>

</body>
</html>
